<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-its Interactivos</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
</head>
<body>
    <div id="aplicacion">
        <header>
            <h2>Post-Its Interactivos</h2>
            <p id="numNotas">Notas: </p>
        </header>
        <main>
            <button id="btnCrear">+</button>
            <div class="cuadros" id="cuadroCrear">
                <p><strong>Crear nota</strong></p>
                Texto:<textarea id="notaTexto"></textarea><br>
                Color:<input type="color" id="notaColor"><br>
                <button id="btnConfirmacion">Crear</button>
                <button id="btnCancelar">Cancelar</button>
            </div>
            <div class="cuadros" id="cuadroEditar">
                <p><strong>Editando nota</strong></p>
                Texto:<textarea id="editTexto"></textarea><br>
                Color:<input type="color" id="editColor"><br>
                <button id="btnEditar">Editar</button>
                <button id="btnCancelar">Cancelar</button>
            </div>
            <div id="cuerpo">

            </div>
        </main>
    </div>
    <div id="login">
        <form>
            <h2>Iniciar sesión</h2>
            <label>Email</label>
            <input type="text" id="correo" required>
            <label>Contraseña</label>
            <input type="password" id="contrasena" required>
            <button id="signIn" type="submit">Login</button>
        </form>
        <p>No tienes un usuario? Registrate</p>
        <form>
            <h2>Registrar usuario</h2>
            <label>Email</label>
            <input type="text" id="correo" required>
            <label>Contraseña</label>
            <input type="password" id="contrasena" required>
            <button id="signup" type="submit">Registrar</button>
        </form>
        <button id="google">Inicia sesión con Google</button>
    </div>
</body>
</html>
